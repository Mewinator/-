<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Set up</title>
        <link rel="manifest" href="/.well-known/manifest.webmanifest">
        <link id="favicon" rel="icon" href="/icon.png">
        <meta name="theme-color" content="#dee1e6" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
        <link rel="stylesheet" href="/vendor/chrome-tabs/chrome-tabs.css">
        <link rel="stylesheet" href="/vendor/chrome-tabs/chrome-tabs-dark-theme.css">
        <link rel="stylesheet" href="/css/home.css">
        <script src="/js/trusted-types.js"></script>
        <script src="/vendor/draggabilly/draggabilly.pkgd.min.js"></script>
        <script src="/vendor/chrome-tabs/chrome-tabs.js"></script>
        <script src="/js/app.js" type="module"></script>
    </head>
    <body>
        <main id="setup-view" class="setup-view" hidden>
            <div class="card">
                <h1>Set up this app</h1>
                <p class="hint">
                    Choose the website this app opens, and the title and icon it uses.
                    Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Alt</kbd>+<kbd>Enter</kbd>
                    later to open the browser and change these settings.
                </p>
                <div id="setup-form-slot"></div>
            </div>
        </main>

        <div id="app-view" class="view app-view inactive">
            <!-- Only shown in the frameless (window controls overlay) mode. -->
            <div class="app-titlebar">
                <img id="app-titlebar-icon" class="app-titlebar-icon" alt="">
                <span id="app-titlebar-title" class="app-titlebar-title"></span>
            </div>
            <div id="app-frame-slot" class="app-frame-slot"></div>
        </div>

        <div id="browser-view" class="view browser-view inactive">
            <div class="tabstrip">
                <div class="chrome-tabs">
                    <div class="chrome-tabs-content"></div>
                    <button id="new-tab" class="new-tab-button" type="button" title="New tab" aria-label="New tab">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </button>
                    <div class="chrome-tabs-bottom-bar"></div>
                </div>
            </div>
            <div class="toolbar">
                <button id="back" class="tb-button" type="button" title="Click to go back" aria-label="Back" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <button id="forward" class="tb-button" type="button" title="Click to go forward" aria-label="Forward" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </button>
                <button id="reload" class="tb-button" type="button" title="Reload this page" aria-label="Reload">
                    <svg class="icon-reload" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <form id="address-form" class="omnibox">
                    <span id="site-info" class="omnibox-icon" data-kind="search" aria-hidden="true">
                        <svg class="icon-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <svg class="icon-secure" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <svg class="icon-insecure" viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    </span>
                    <input id="address" type="text" placeholder="Search Google or type a URL"
                        aria-label="Address and search bar" autocomplete="off" spellcheck="false">
                </form>
                <button id="menu-button" class="tb-button" type="button" title="Customize and control Portal"
                    aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
            <div id="tab-frames" class="tab-frames"></div>

            <div id="app-menu" class="menu" role="menu" hidden>
                <button type="button" role="menuitem" data-action="new-tab">New tab</button>
                <hr>
                <button type="button" role="menuitem" data-action="settings">Settings</button>
                <button type="button" role="menuitem" data-action="exit">
                    Back to app <span class="menu-shortcut">Ctrl+Shift+Alt+Enter</span>
                </button>
            </div>
        </div>

        <dialog id="settings-dialog" class="settings-dialog">
            <h2>Settings</h2>
            <div id="settings-form-slot"></div>
        </dialog>

        <p id="unsupported" class="unsupported" hidden>
            Controlled Frame isn't available. Install and open this app as an
            Isolated Web App in Chrome.
        </p>

        <template id="config-form-template">
            <form class="config-form">
                <label class="field">
                    <span class="field-label">Title</span>
                    <input name="title" required placeholder="Shown in the window title" autocomplete="off">
                </label>
                <div class="field">
                    <span class="field-label">Icon</span>
                    <div class="icon-row">
                        <img class="icon-preview" alt="">
                        <input name="iconUrl" aria-label="Icon URL" placeholder="https://example.com/icon.png"
                            autocomplete="off" inputmode="url">
                        <label class="button">Upload<input name="iconFile" type="file" accept="image/*" hidden></label>
                    </div>
                    <small class="icon-status" aria-live="polite"></small>
                </div>
                <label class="field">
                    <span class="field-label">Website URL</span>
                    <input name="siteUrl" required placeholder="https://example.com" autocomplete="off" inputmode="url">
                </label>
                <div class="settings-only">
                    <label class="field">
                        <span class="field-label">Search engine</span>
                        <select name="searchEngine"></select>
                    </label>
                    <label class="field custom-search">
                        <span class="field-label">Custom search URL</span>
                        <input name="customSearch" placeholder="https://example.com/search?q=%s" autocomplete="off">
                    </label>
                    <label class="field">
                        <span class="field-label">New tab page</span>
                        <input name="newTabUrl" placeholder="Search engine home page" autocomplete="off" inputmode="url">
                    </label>
                </div>
                <p class="form-error" role="alert"></p>
                <div class="form-actions">
                    <button type="button" class="button danger settings-only reset">Reset everything</button>
                    <span class="spacer"></span>
                    <button type="button" class="button settings-only cancel">Cancel</button>
                    <button type="submit" class="button primary">Save</button>
                </div>
            </form>
        </template>
    </body>
</html>
